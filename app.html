<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Love Story 💖</title>

<style>
body{
margin:0;
height:100vh;
overflow:hidden;
background:#000;
}

/* iframe */
iframe{
width:100%;
height:100%;
border:none;
}

/* back button */
#backBtn{
position:fixed;
bottom:20px;
left:20px;
z-index:9999;

padding:10px 18px;
border:none;
border-radius:25px;

background:#ff5ea8;
color:white;
font-family:cursive;
font-size:16px;
}
</style>
</head>

<body>

<button id="backBtn">💖 Back</button>

<iframe id="frame" src="index.html"></iframe>

<script>

const frame = document.getElementById("frame");

/* SIMPLE STACK */
let stack = ["index.html"];
let i = 0;

/* OPEN NEW PAGE */
document.addEventListener("click",(e)=>{
let a = e.target.closest("a");
if(!a) return;

e.preventDefault();

let link = a.getAttribute("href");

i++;
stack[i] = link;

frame.src = link;
});

/* BACK BUTTON */
document.getElementById("backBtn").addEventListener("click",()=>{

if(i > 0){
i--;
frame.src = stack[i];
}else{
frame.src = "index.html";
i = 0;
}

});

</script>

<script>

<script>
function resetUI(){
document.body.classList.remove("fade-out");
document.body.style.opacity = "1";
document.body.style.visibility = "visible";
document.body.style.pointerEvents = "auto";
document.body.style.filter = "none";

/* restart animations properly */
document.querySelectorAll("*").forEach(el=>{
el.style.animationPlayState = "running";
});
}

/* runs when page comes back (MOST IMPORTANT) */
window.addEventListener("pageshow", resetUI);
window.addEventListener("load", resetUI);

/* safety heartbeat (prevents freeze) */
setInterval(resetUI, 3000);

<script>
function initPage(){
/* reset visual state */
document.body.classList.remove("fade-out");
document.body.style.opacity = "1";
document.body.style.visibility = "visible";
document.body.style.pointerEvents = "auto";
document.body.style.filter = "none";

/* restart animations safely */
document.querySelectorAll("*").forEach(el=>{
el.style.animationPlayState = "running";
});
}

/* GitHub Pages BACK FIX (MOST IMPORTANT) */
window.addEventListener("pageshow", initPage);

/* normal load */
window.addEventListener("load", initPage);

</script>

</script>
</body>
</html>
